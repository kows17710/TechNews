name: Daily Tech News Clipping

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. 정각(:00)은 혼잡해 지연이 크므로 오프피크 분 사용.
    # 22:50 UTC = 07:50 KST (8시보다 약간 앞서 버퍼를 둠)
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "true 로 두면 메일을 보내지 않고 코드 검증만 수행"
        default: "false"

# 발송 이력 파일을 저장소에 커밋하기 위한 쓰기 권한
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: daily-clip
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run clipper
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PREVIEW: ${{ github.event.inputs.preview == 'true' && '1' || '' }}
        run: python tech_news_clipper.py

      - name: Persist sent history
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent_history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_history.json
            git commit -m "Update sent history [skip ci]"
            git push
          else
            echo "발송 이력 변경 없음 — 커밋 생략"
          fi
