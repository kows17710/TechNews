name: Daily Tech News Clipping

on:
  # 정시 발송은 외부 크론(cron-job.org)이 매일 09:00 KST 에 workflow_dispatch 를 호출한다.
  # GitHub 자체 schedule 은 지연이 심해 제거함.
  workflow_dispatch:
    inputs:
      preview:
        description: "true 로 두면 메일을 보내지 않고 코드 검증만 수행"
        default: "false"

# 발송 이력 파일을 저장소에 커밋하기 위한 쓰기 권한
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: daily-clip
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet anthropic

      - name: Run clipper
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW: ${{ github.event.inputs.preview == 'true' && '1' || '' }}
        run: python tech_news_clipper.py

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview.html
          if-no-files-found: ignore

      - name: Persist sent history
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent_history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent_history.json
            git commit -m "Update sent history [skip ci]"
            git push
          else
            echo "발송 이력 변경 없음 — 커밋 생략"
          fi
